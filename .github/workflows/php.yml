name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: openswoole-26.2.0, pcntl
          coverage: pcov
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit
      - run: composer lint
      - run: composer coverage
      - run: composer archive --format=zip --dir=dist

  minimum-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: openswoole-26.2.0
          coverage: none
          tools: composer:v2
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - run: composer check-platform-reqs --no-dev
      - run: php -r 'require "vendor/autoload.php"; $client = new Kanata\ConveyorServerClient\Client([]); $client->close();'
